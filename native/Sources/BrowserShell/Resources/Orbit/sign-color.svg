<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <title>Orbit application icon</title>
  <desc>Vector from docs/brand/orbit/orbit-da.html, App icon: 23% corners, 72% mark, orbital ink, Halo to Dawn to Sun ring and a warm white satellite.</desc>
  <defs>
    <radialGradient id="background" cx=".3" cy=".15" r=".72"><stop stop-color="#2E2360"/><stop offset="1" stop-color="#0D0B1E"/></radialGradient>
    <linearGradient id="ring" x1="0" y1="1" x2="1" y2="0"><stop stop-color="#9D8CFF"/><stop offset=".6" stop-color="#FF7A59"/><stop offset="1" stop-color="#FFC56E"/></linearGradient>
    <radialGradient id="satellite" cx=".35" cy=".35" r=".7"><stop stop-color="#FFFFFF"/><stop offset="1" stop-color="#FFE3C2"/></radialGradient>
    <filter id="glow" x="-100%" y="-100%" width="300%" height="300%"><feGaussianBlur stdDeviation="3" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  </defs>
  <rect x="50" y="50" width="924" height="924" rx="212.52" fill="url(#background)"/>
  <rect x="50.5" y="50.5" width="923" height="923" rx="212" fill="none" stroke="#FFFFFF" stroke-opacity=".1"/>
  <g transform="translate(179.36 179.36) scale(6.6528)">
    <circle cx="50" cy="50" r="34" fill="none" stroke="url(#ring)" stroke-width="12" stroke-linecap="round" stroke-dasharray="169.6 44"/>
    <circle cx="77.2" cy="29.5" r="8" fill="url(#satellite)" filter="url(#glow)"/>
  </g>
</svg>
