name: Release download statistics
on:
  workflow_dispatch:
    inputs:
      limit:
        description: Number of releases in the table (0 for all)
        type: number
        default: 20
permissions:
  contents: read
jobs:
  statistics:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Read release asset counters
        env:
          GH_TOKEN: ${{ github.token }}
          DOWNLOAD_STATS_LIMIT: ${{ inputs.limit }}
        run: python3 scripts/download-stats.py --limit "$DOWNLOAD_STATS_LIMIT" > "$GITHUB_STEP_SUMMARY"
