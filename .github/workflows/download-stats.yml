name: Release download statistics
on:
  workflow_dispatch:
    inputs:
      limit:
        description: Number of releases in the table (0 for all)
        type: number
        default: 20
permissions: {}
jobs:
  statistics:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - name: Read release asset counters
        env:
          GH_TOKEN: ${{ github.token }}
          DOWNLOAD_STATS_LIMIT: ${{ inputs.limit }}
        run: python3 scripts/download-stats.py --limit "$DOWNLOAD_STATS_LIMIT" > "$GITHUB_STEP_SUMMARY"
