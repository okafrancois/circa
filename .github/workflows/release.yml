name: Release Circa
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: Existing vX.Y.Z tag to publish
        required: true
        type: string
permissions:
  contents: write
concurrency:
  group: orbit-release
  cancel-in-progress: false
jobs:
  release:
    if: >-
      github.repository_id == '1436869204' &&
      github.repository_owner == 'okafrancois' && github.actor == 'okafrancois' &&
      (github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/v'))
    runs-on: [self-hosted, macOS, ARM64, orbit-release]
    steps:
      - name: Require a browser version tag
        env:
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
        run: '[[ "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]'
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          ref: ${{ inputs.tag || github.ref }}
          clean: false
      - name: Link the prebuilt engine tools
        # The CEF distribution and Sparkle tools are local to the release Mac, never in Git.
        # Set ORBIT_TOOLS_DIR in the runner's .env file.
        run: |
          if [ ! -e .tools ]; then ln -s "${ORBIT_TOOLS_DIR:?Set ORBIT_TOOLS_DIR in the runner .env}" .tools; fi
          test -d .tools/chromium-fork/distrib
      - name: Build, sign, notarize when configured, and publish
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
        run: python3 scripts/release.py --tag "$RELEASE_TAG" --publish
