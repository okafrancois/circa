name: Release Orbit
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: Existing vX.Y.Z tag to publish
        required: true
        type: string
permissions:
  contents: write
concurrency:
  group: orbit-release
  cancel-in-progress: false
jobs:
  release:
    if: >-
      github.repository == 'okafrancois/orbit-browser' &&
      github.repository_owner == 'okafrancois' && github.actor == 'okafrancois' &&
      (github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/v'))
    runs-on: [self-hosted, macOS, ARM64, orbit-release]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ inputs.tag || github.ref }}
          clean: false
      - name: Build, sign, notarize when configured, and publish
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
        run: python3 scripts/release.py --tag "$RELEASE_TAG" --publish
